<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Background Page</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        max-width: 1920px;
        margin: 0 auto;
        background-image: url("background.webp");
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      html {
        background-color: #000;
      }

      .top-container {
        display: flex;
        justify-content: space-between;
        padding: 20px;
        position: absolute;
        top: 150px;
        left: 50px;
        width: calc(100% - 210px);
      }

      .top-container button:first-child {
        margin-left: 0;
      }

      .bottom-container {
        position: absolute;
        bottom: 40px;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .center-image {
        position: absolute;
        top: 18%;
        left: 45%;
        transform: translate(-50%, -50%);
        width: 10vw;
        height: 10vw;
        min-width: 80px;
        min-height: 80px;
        max-width: 150px;
        max-height: 150px;
        object-fit: contain;
        transition: opacity 0.3s ease;
      }

      button {
        padding: 20px 40px;
        font-size: 20px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        transition: all 0.3s ease;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        background-color: transparent;
        color: transparent;
        text-shadow: none;
        width: 150px;
        height: 50px;
      }

      .top-container button:first-child {
        background-image: url("Home1.png");
      }

      .top-container button:first-child:hover {
        background-image: url("Home2.png");
      }

      .top-container button:first-child:active {
        background-image: url("Home3.png");
      }

      .top-container button:last-child {
        background-image: url("Twitter1.png");
      }

      .top-container button:last-child:hover {
        background-image: url("Twitter2.png");
      }

      .top-container button:last-child:active {
        background-image: url("Twitter3.png");
      }

      .bottom-container button {
        background-image: url("Spin1.png");
      }

      .bottom-container button:hover {
        background-image: url("Spin2.png");
      }

      .bottom-container button:active {
        background-image: url("Spin3.png");
      }

      button:hover {
        transform: none;
        box-shadow: none;
      }

      @media (max-width: 1800px) {
        .center-image {
          top: 20%;
        }
        .top-container {
          top: 160px;
        }
      }

      @media (max-width: 1600px) {
        .center-image {
          top: 22%;
        }
        .top-container {
          top: 170px;
        }
      }

      @media (max-width: 1400px) {
        .center-image {
          top: 25%;
        }
        .top-container {
          top: 180px;
          width: calc(100% - 210px);
        }
      }

      @media (max-width: 1200px) {
        .center-image {
          top: 30%;
        }
        .top-container {
          top: 190px;
          left: 40px;
          width: calc(100% - 200px);
        }
      }

      @media (max-width: 1000px) {
        .center-image {
          top: 35%;
        }
        .top-container {
          top: 260px;
          left: 30px;
          width: calc(100% - 130px);
        }
      }

      @media (max-width: 800px) {
        .center-image {
          top: 35%;
          width: 15vw;
          height: 15vw;
          min-width: 120px;
          min-height: 120px;
          max-width: 225px;
          max-height: 225px;
        }
        .top-container {
          top: 280px;
          left: 0px;
          width: calc(100% - 60px);
          button {
            padding: 15px 30px;
            font-size: 18px;
          }
        }
      }

      @media (max-width: 600px) {
        .top-container {
          top: 330px;
          left: -20px;
          width: calc(100% - 20px);
          button {
            padding: 12px 24px;
            font-size: 16px;
          }
        }
      }

      .loader {
        position: absolute;
        top: 18%;
        left: 45%;
        transform: translate(-50%, -50%);
        width: 48px;
        height: 48px;
        border: 5px solid #fff;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: none;
        animation: rotation 1s linear infinite;
        z-index: 1;
      }

      @keyframes rotation {
        0% {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        100% {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      @media (max-width: 1800px) {
        .loader {
          top: 20%;
        }
      }

      @media (max-width: 1600px) {
        .loader {
          top: 22%;
        }
      }

      @media (max-width: 1400px) {
        .loader {
          top: 25%;
        }
      }

      @media (max-width: 1200px) {
        .loader {
          top: 30%;
        }
      }

      @media (max-width: 1000px) {
        .loader {
          top: 35%;
        }
      }
    </style>
  </head>
  <body>
    <div class="top-container">
      <button onclick="window.location.href='https://smokincat.io'">
        Homepage
      </button>
      <button onclick="shareOnTwitter()">Share on Twitter</button>
    </div>

    <img id="centerImage" alt="Rotating Image" class="center-image" />
    <div class="loader" id="imageLoader"></div>

    <div class="bottom-container">
      <button onclick="spinImage()">Spin</button>
    </div>

    <script>
      async function checkImageExists(imagePath) {
        try {
          const response = await fetch(imagePath);
          return response.ok;
        } catch {
          return false;
        }
      }

      async function generateImageList() {
        const imageCount = 46;
        const images = [];

        for (let i = 1; i <= imageCount; i++) {
          const imagePath = `imgs/${i}.webp`;
          if (await checkImageExists(imagePath)) {
            images.push(imagePath);
          }
        }
        console.log("Found images:", images); // Debug log
        return images;
      }

      let availableImages = [];
      let usedImages = [];

      async function initializeImages() {
        showLoader();
        availableImages = await generateImageList();
        if (availableImages.length > 0) {
          const imageElement = document.getElementById("centerImage");
          const tempImage = new Image();
          tempImage.onload = function () {
            imageElement.src = availableImages[0];
            hideLoader();
          };
          tempImage.onerror = function () {
            console.error("Error loading initial image");
            hideLoader();
          };
          tempImage.src = availableImages[0];
        } else {
          hideLoader();
        }
      }

      function getRandomImage() {
        if (availableImages.length === 0) {
          availableImages = [...usedImages];
          usedImages = [];
        }

        const randomIndex = Math.floor(Math.random() * availableImages.length);
        const selectedImage = availableImages[randomIndex];

        availableImages.splice(randomIndex, 1);
        usedImages.push(selectedImage);

        return selectedImage;
      }

      function showLoader() {
        document.getElementById("imageLoader").style.display = "block";
        document.getElementById("centerImage").style.opacity = "0";
      }

      function hideLoader() {
        document.getElementById("imageLoader").style.display = "none";
        document.getElementById("centerImage").style.opacity = "1";
      }

      function spinImage() {
        const imageElement = document.getElementById("centerImage");
        showLoader();

        imageElement.onerror = function () {
          console.error("Error loading image:", this.src);
          this.src = getRandomImage();
          hideLoader();
        };

        setTimeout(() => {
          const newImage = getRandomImage();
          console.log("Loading new image:", newImage);

          const tempImage = new Image();
          tempImage.onload = function () {
            imageElement.src = newImage;
            hideLoader();
          };
          tempImage.onerror = function () {
            console.error("Error loading image:", newImage);
            hideLoader();
          };
          tempImage.src = newImage;
        }, 300);
      }

      // Initialize images when page loads
      initializeImages();

      function shareOnTwitter() {
        const text = "Check out this awesome website!";
        const url = window.location.href;
        const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(
          text
        )}&url=${encodeURIComponent(url)}`;
        window.open(twitterUrl, "_blank");
      }
    </script>
  </body>
</html>
