<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Background Page</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        max-width: 1920px;
        margin: 0 auto;
        background-image: url("background.webp");
        background-size: contain;
        background-position: center;
        background-repeat: no-repeat;
        display: flex;
        flex-direction: column;
        position: relative;
      }

      html {
        background-color: #fff;
      }

      .top-container {
        display: flex;
        justify-content: space-between;
        padding: 20px;
        position: absolute;
        top: 150px;
        left: 50px;
        width: calc(100% - 210px);
      }

      .top-container button:first-child {
        margin-left: 0;
      }

      .bottom-container {
        position: absolute;
        bottom: 40px;
        width: 100%;
        display: flex;
        justify-content: center;
      }

      .center-image {
        position: absolute;
        top: 18%;
        left: 45%;
        transform: translate(-50%, -50%);
        width: 10vw;
        height: 10vw;
        min-width: 80px;
        min-height: 80px;
        max-width: 150px;
        max-height: 150px;
        object-fit: contain;
        transition: opacity 0.3s ease;
      }

      button {
        padding: 20px 40px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        transition: all 0.3s ease;
        background-size: contain;
        background-repeat: no-repeat;
        background-position: center;
        background-color: transparent;
        color: transparent;
        text-shadow: none;
        width: 200px;
        height: 70px;
      }

      .top-container button:first-child {
        background-image: url("Home1.png");
      }

      .top-container button:first-child:hover {
        background-image: url("Home2.png");
      }

      .top-container button:first-child:active {
        background-image: url("Home3.png");
      }

      .top-container button:last-child {
        background-image: url("Twitter1.png");
      }

      .top-container button:last-child:hover {
        background-image: url("Twitter2.png");
      }

      .top-container button:last-child:active {
        background-image: url("Twitter3.png");
      }

      .bottom-container button {
        background-image: url("Spin1.png");
      }

      .bottom-container button:hover {
        background-image: url("Spin2.png");
      }

      .bottom-container button:active {
        background-image: url("Spin3.png");
      }

      button:hover {
        transform: none;
        box-shadow: none;
      }

      @media (max-width: 1800px) {
        .center-image {
          top: 20%;
        }
        .top-container {
          top: 160px;
        }
      }

      @media (max-width: 1600px) {
        .center-image {
          top: 22%;
        }
        .top-container {
          top: 170px;
        }
      }

      @media (max-width: 1400px) {
        .center-image {
          top: 25%;
        }
        .top-container {
          top: 180px;
          width: calc(100% - 210px);
        }
      }

      @media (max-width: 1200px) {
        .center-image {
          top: 30%;
        }
        .top-container {
          top: 220px;
          left: 40px;
          width: calc(100% - 150px);
        }
      }

      @media (max-width: 1000px) {
        .center-image {
          top: 35%;
        }
        .top-container {
          top: 260px;
          left: 30px;
          width: calc(100% - 130px);
        }
      }

      @media (max-width: 800px) {
        .center-image {
          top: 35%;
          width: 15vw;
          height: 15vw;
          min-width: 120px;
          min-height: 120px;
          max-width: 225px;
          max-height: 225px;
        }
        .top-container {
          top: 280px;
          left: 0px;
          width: calc(100% - 60px);
          button {
            padding: 15px 30px;
            font-size: 18px;
          }
        }
      }

      @media (max-width: 600px) {
        .top-container {
          top: 350px;
          left: -40px;
          width: 100%;
          button {
            padding: 12px 24px;
            font-size: 16px;
            height: 50px;
          }
        }
      }

      .loader {
        position: absolute;
        top: 18%;
        left: 45%;
        transform: translate(-50%, -50%);
        width: 48px;
        height: 48px;
        border: 5px solid #fff;
        border-bottom-color: transparent;
        border-radius: 50%;
        display: none;
        animation: rotation 1s linear infinite;
        z-index: 1;
      }

      @keyframes rotation {
        0% {
          transform: translate(-50%, -50%) rotate(0deg);
        }
        100% {
          transform: translate(-50%, -50%) rotate(360deg);
        }
      }

      @media (max-width: 1800px) {
        .loader {
          top: 20%;
        }
      }

      @media (max-width: 1600px) {
        .loader {
          top: 22%;
        }
      }

      @media (max-width: 1400px) {
        .loader {
          top: 25%;
        }
      }

      @media (max-width: 1200px) {
        .loader {
          top: 30%;
        }
      }

      @media (max-width: 1000px) {
        .loader {
          top: 35%;
        }
      }

      .share-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-end;
      }

      .meme-input {
        padding: 10px;
        border-radius: 8px;
        border: 2px solid #333;
        background: rgba(255, 255, 255, 0.9);
        width: 200px;
        font-size: 16px;
        height: 60px; /* Adjust height for textarea */
      }

      .image-text-container {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
      }

      .display-text {
        margin-left: 40px; /* 40% gap */
        font-size: 24px;
        color: white; /* Change color as needed */
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7); /* Add shadow for visibility */
      }

      @media (max-width: 800px) {
        .share-container {
          align-items: center;
        }
        .meme-input {
          width: 180px;
        }
        .display-text {
          font-size: 20px; /* Adjust font size for smaller screens */
        }
      }
    </style>
  </head>
  <body>
    <div class="top-container">
      <button onclick="window.location.href='https://smokincat.io'">
        Homepage
      </button>
      <div class="share-container">
        <textarea
          id="memeText"
          placeholder="Add your meme text here..."
          class="meme-input"
        ></textarea>
        <button onclick="shareOnTwitter()">Share on Twitter</button>
      </div>
    </div>

    <div class="image-text-container">
      <img
        id="centerImage"
        alt="Loading..."
        class="center-image"
        loading="lazy"
      />
      <div id="displayText" class="display-text"></div>
    </div>
    <div class="loader" id="imageLoader"></div>

    <div class="bottom-container">
      <button onclick="spinImage()">Spin</button>
    </div>

    <script>
      async function checkImageExists(imagePath) {
        try {
          const response = await fetch(imagePath);
          return response.ok;
        } catch {
          return false;
        }
      }

      async function generateImageList() {
        const imageCount = 46;
        const images = [];

        for (let i = 1; i <= imageCount; i++) {
          const imagePath = `imgs/${i}.webp`;
          if (await checkImageExists(imagePath)) {
            images.push(imagePath);
          }
        }
        console.log("Found images:", images); // Debug log
        return images;
      }

      let availableImages = [];
      let usedImages = [];
      let preloadedImages = {}; // Cache for preloaded images

      // Add this new function for image optimization
      function createOptimizedImageUrl(imagePath) {
        // Check if running on localhost
        if (
          window.location.hostname === "localhost" ||
          window.location.hostname === "127.0.0.1"
        ) {
          return imagePath;
        }
        // Add Cloudinary or similar CDN URL
        // Example: return `https://your-cloudinary-url/${imagePath}?q=auto&w=auto`;
        return imagePath;
      }

      // Update the preloadImages function
      async function preloadImages(imageUrls, priority = false) {
        const promises = imageUrls.map((url) => {
          return new Promise((resolve, reject) => {
            const img = new Image();
            img.onload = () => {
              preloadedImages[url] = img;
              resolve(url);
            };
            img.onerror = () => reject(url);
            if (priority) {
              img.fetchPriority = "high";
            }
            img.src = createOptimizedImageUrl(url);
          });
        });

        return Promise.allSettled(promises);
      }

      // Update initializeImages function
      async function initializeImages() {
        showLoader();
        const imageElement = document.getElementById("centerImage");
        imageElement.style.visibility = "hidden";

        availableImages = await generateImageList();

        if (availableImages.length > 0) {
          // Preload first image with high priority
          await preloadImages([availableImages[0]], true);

          // Show first image
          imageElement.src = createOptimizedImageUrl(availableImages[0]);
          imageElement.style.visibility = "visible";
          hideLoader();

          // Preload next 3 images in background
          requestIdleCallback(() => {
            preloadImages(availableImages.slice(1, 4));
          });
        } else {
          hideLoader();
        }
      }

      function getRandomImage() {
        if (availableImages.length === 0) {
          availableImages = [...usedImages];
          usedImages = [];
        }

        const randomIndex = Math.floor(Math.random() * availableImages.length);
        const selectedImage = availableImages[randomIndex];

        availableImages.splice(randomIndex, 1);
        usedImages.push(selectedImage);

        return selectedImage;
      }

      function showLoader() {
        document.getElementById("imageLoader").style.display = "block";
        document.getElementById("centerImage").style.opacity = "0";
      }

      function hideLoader() {
        document.getElementById("imageLoader").style.display = "none";
        document.getElementById("centerImage").style.opacity = "1";
      }

      // Update spinImage function
      function spinImage() {
        const imageElement = document.getElementById("centerImage");
        showLoader();
        imageElement.style.visibility = "hidden";

        const newImage = getRandomImage();

        if (preloadedImages[newImage]) {
          setTimeout(() => {
            imageElement.src = createOptimizedImageUrl(newImage);
            imageElement.style.visibility = "visible";
            hideLoader();
          }, 300);
        } else {
          const tempImage = new Image();
          tempImage.onload = function () {
            setTimeout(() => {
              imageElement.src = createOptimizedImageUrl(newImage);
              imageElement.style.visibility = "visible";
              hideLoader();
              preloadedImages[newImage] = tempImage;
            }, 300);
          };
          tempImage.onerror = function () {
            console.error("Error loading image:", newImage);
            hideLoader();
          };
          tempImage.src = createOptimizedImageUrl(newImage);
        }

        // Preload next 2 images when browser is idle
        requestIdleCallback(() => {
          const unloadedImages = availableImages.filter(
            (img) => !preloadedImages[img]
          );
          preloadImages(unloadedImages.slice(0, 2));
        });
      }

      // Initialize images when page loads
      initializeImages();

      async function shareOnTwitter() {
        try {
          const shareButton = document.querySelector(
            ".top-container button:last-child"
          );
          shareButton.style.opacity = "0.5";
          shareButton.disabled = true;

          // Create a canvas element
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");

          // Set canvas size to match viewport
          canvas.width = document.body.clientWidth;
          canvas.height = document.body.clientHeight;

          // Create new image elements
          const backgroundImg = new Image();
          backgroundImg.crossOrigin = "anonymous"; // Enable CORS
          const centerImg = document.getElementById("centerImage");

          // Load background image
          await new Promise((resolve, reject) => {
            backgroundImg.onload = resolve;
            backgroundImg.onerror = reject;
            backgroundImg.src = getComputedStyle(document.body)
              .backgroundImage.slice(4, -1)
              .replace(/['"]/g, "");
          });

          // Draw background
          ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);

          // Draw center image in its current position
          const centerRect = centerImg.getBoundingClientRect();
          ctx.drawImage(
            centerImg,
            centerRect.left,
            centerRect.top,
            centerRect.width,
            centerRect.height
          );

          // Get meme text and draw it
          const memeText = document.getElementById("memeText").value;
          const textX = centerRect.right + 40; // 40px gap to the right of the image
          const textY = centerRect.top + centerRect.height / 2; // Center vertically

          if (memeText) {
            ctx.font = "bold 24px Arial";
            ctx.fillStyle = "white";
            ctx.strokeStyle = "black";
            ctx.lineWidth = 4;
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";

            // Draw text outline
            ctx.strokeText(memeText, textX, textY);
            ctx.fillText(memeText, textX, textY);
          }

          // Convert canvas to blob
          const blob = await new Promise((resolve) =>
            canvas.toBlob(resolve, "image/png")
          );

          // Create a URL for the blob
          const url = URL.createObjectURL(blob);

          // Prepare Twitter share
          const twitterText = memeText || "Check out my awesome spin result!";
          const twitterUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(
            twitterText
          )}&url=${encodeURIComponent(url)}`;
          window.open(twitterUrl, "_blank");
        } catch (error) {
          console.error("Error creating share image:", error);
          alert("Sorry, there was an error creating the share image.");
        } finally {
          const shareButton = document.querySelector(
            ".top-container button:last-child"
          );
          shareButton.style.opacity = "1";
          shareButton.disabled = false;
        }
      }
    </script>
  </body>
</html>
